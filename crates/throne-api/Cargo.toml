[package]
name = "throne-api"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "sync", "macros", "rt"] }

[dev-dependencies]
base64 = "0.23.1"
hex = "0.4.3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "rt"] }
