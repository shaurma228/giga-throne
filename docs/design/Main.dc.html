<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>giga-throne — главная</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#C8FF4D}a:hover{color:#E2FF9A}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1040px; height: 680px; box-sizing: border-box; display: flex; background: #0E0E12; color: #F4F4F6; font-family: Manrope, system-ui, sans-serif; overflow: hidden; border-radius: 20px">

  <nav aria-label="Разделы" style="width: 72px; flex-shrink: 0; background: #121217; border-right: 1px solid #1F1F27; display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 8px; box-sizing: border-box">
    <div style="width: 40px; height: 40px; border-radius: 12px; background: {{accent}}; color: #0E0E12; display: flex; align-items: center; justify-content: center; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 15px; margin-bottom: 16px">gt</div>
    <a href="Main.dc.html" aria-label="Главная" style="width: 44px; height: 44px; border-radius: 12px; background: #22222B; color: {{accent}}; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>
    </a>
    <a href="Servers.dc.html" aria-label="Серверы" style="width: 44px; height: 44px; border-radius: 12px; color: #8A8A96; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"></path></svg>
    </a>
    <a href="Main.dc.html" aria-label="Правила" style="width: 44px; height: 44px; border-radius: 12px; color: #8A8A96; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3v18"></path><path d="M6 9a6 6 0 0 0 6 6h6"></path><path d="M15 12l3 3-3 3"></path></svg>
    </a>
    <a href="Main.dc.html" aria-label="Статистика" style="width: 44px; height: 44px; border-radius: 12px; color: #8A8A96; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11"></path><path d="M12 20V4"></path><path d="M19 20v-6"></path></svg>
    </a>
    <div style="flex-grow: 1"></div>
    <a href="Import.dc.html" aria-label="Добавить сервер" style="width: 44px; height: 44px; border-radius: 12px; border: 1px dashed #3A3A46; color: #F4F4F6; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
    <a href="Main.dc.html" aria-label="Настройки" style="width: 44px; height: 44px; border-radius: 12px; color: #8A8A96; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9"></path><path d="M19 7h1"></path><circle cx="16" cy="7" r="2.5"></circle><path d="M4 17h3"></path><path d="M13 17h7"></path><circle cx="10" cy="17" r="2.5"></circle></svg>
    </a>
  </nav>

  <main style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0; position: relative">
    <div style="position: absolute; left: 50%; top: 250px; width: 520px; height: 520px; margin-left: -260px; margin-top: -260px; border-radius: 50%; background: {{glow}}; pointer-events: none"></div>

    <header style="height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: relative">
      <div style="font-family: Unbounded, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.02em; color: #8A8A96">giga-throne</div>
      <div style="display: flex; gap: 6px">
        <button aria-label="Свернуть" style="width: 28px; height: 28px; border-radius: 8px; border: none; background: transparent; color: #8A8A96; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
        </button>
        <button aria-label="Закрыть в трей" style="width: 28px; height: 28px; border-radius: 8px; border: none; background: transparent; color: #8A8A96; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
    </header>

    <section style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; position: relative; padding-bottom: 8px">
      <div style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; border-radius: 999px; background: {{chipBg}}; color: {{chipFg}}; font-size: 13px; font-weight: 600">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: {{chipFg}}"></span>
        <span>{{statusText}}</span>
      </div>

      <button onClick="{{toggle}}" aria-label="{{btnLabel}}" style="{{btnStyle}}">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"></path><path d="M6.3 6.8a8 8 0 1 0 11.4 0"></path></svg>
      </button>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 500; letter-spacing: 0.02em; color: {{timerColor}}">{{timer}}</div>
        <div style="font-size: 13px; color: #8A8A96">{{hint}}</div>
      </div>

      <a href="Servers.dc.html" style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px 0 8px; border-radius: 16px; background: #17171D; border: 1px solid #262630; color: #F4F4F6; text-decoration: none; min-width: 300px; box-sizing: border-box">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: #26262F; display: flex; align-items: center; justify-content: center; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 12px">{{cur.code}}</span>
        <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
          <span style="font-weight: 700; font-size: 15px">{{cur.city}}</span>
          <span style="font-size: 12px; color: #8A8A96">{{cur.proto}} · {{cur.ping}} мс</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A96" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>

      <div role="radiogroup" aria-label="Режим" style="display: flex; padding: 4px; border-radius: 14px; background: #17171D; border: 1px solid #262630; gap: 4px">
        <button role="radio" aria-checked="{{modeAllOn}}" onClick="{{setAll}}" style="{{modeAllStyle}}">Всё через VPN</button>
        <button role="radio" aria-checked="{{modeSmartOn}}" onClick="{{setSmart}}" style="{{modeSmartStyle}}">Только заблокированное</button>
      </div>
    </section>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 0 20px 20px; position: relative">
      <div style="background: #17171D; border: 1px solid #22222B; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8A8A96">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"></path></svg>Загрузка</div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 20px">{{down}}</div>
      </div>
      <div style="background: #17171D; border: 1px solid #22222B; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8A8A96">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>Отдача</div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 20px">{{up}}</div>
      </div>
      <div style="background: #17171D; border: 1px solid #22222B; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 12px; color: #8A8A96">Твой IP</div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 16px; line-height: 24px">{{ip}}</div>
      </div>
    </div>
  </main>

  <aside style="width: 320px; flex-shrink: 0; background: #121217; border-left: 1px solid #1F1F27; display: flex; flex-direction: column; padding: 18px 14px 14px; box-sizing: border-box; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 6px">
      <h2 style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 16px">Серверы</h2>
      <button style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 10px; border: 1px solid #2A2A34; background: transparent; color: #F4F4F6; font-size: 13px; font-weight: 600; cursor: pointer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>Самый быстрый</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
      <sc-for list="{{servers}}" as="s" hint-placeholder-count="6">
        <button onClick="{{s.pick}}" aria-pressed="{{s.sel}}" style="{{s.rowStyle}}">
          <span style="width: 34px; height: 34px; border-radius: 10px; background: #26262F; display: flex; align-items: center; justify-content: center; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 11px; color: #F4F4F6; flex-shrink: 0">{{s.code}}</span>
          <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0; text-align: left; gap: 2px">
            <span style="font-weight: 700; font-size: 14px; color: #F4F4F6">{{s.city}}</span>
            <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: {{s.protoFg}}">{{s.proto}}</span>
          </span>
          <span style="display: flex; align-items: flex-end; gap: 2px; height: 14px" aria-hidden="true">
            <span style="{{s.b1}}"></span><span style="{{s.b2}}"></span><span style="{{s.b3}}"></span>
          </span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #B4B4BE; width: 48px; text-align: right">{{s.ping}} мс</span>
        </button>
      </sc-for>
    </div>
    <a href="Servers.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 12px; background: #1A1A21; color: #F4F4F6; font-size: 13px; font-weight: 600; text-decoration: none">Все серверы · 24</a>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8FF4D","options":["#C8FF4D","#FF7AD9","#5CE1FF","#FF9F43"]},"startConnected":{"editor":"boolean","default":true},"$preview":{"width":1040,"height":680}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: (props.startConnected ?? true) ? 'on' : 'off', secs: 2563, mode: 'all', sel: 0 };
  }
  componentDidMount() {
    this.tick = setInterval(() => {
      if (this.state.phase === 'on') this.setState({ secs: this.state.secs + 1 });
    }, 1000);
  }
  componentWillUnmount() {
    clearInterval(this.tick);
    clearTimeout(this.wait);
  }
  rgba(hex, a) {
    const n = parseInt(hex.replace('#', ''), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  renderVals() {
    const accent = this.props.accent ?? '#C8FF4D';
    const { phase, secs, mode, sel } = this.state;
    const on = phase === 'on';
    const busy = phase === 'busy';
    const pad = (x) => String(x).padStart(2, '0');
    const timer = on ? pad(Math.floor(secs / 3600)) + ':' + pad(Math.floor(secs / 60) % 60) + ':' + pad(secs % 60) : '00:00:00';
    const protoColors = { VLESS: '#9DB8FF', HY2: '#FFB0E6', TUIC: '#8FE3F2', TROJAN: '#FFC98A', SS: '#C9B8FF' };
    const raw = [
      { code: 'NL', city: 'Амстердам', proto: 'VLESS', ping: 38 },
      { code: 'DE', city: 'Франкфурт', proto: 'HY2', ping: 44 },
      { code: 'FI', city: 'Хельсинки', proto: 'VLESS', ping: 52 },
      { code: 'TR', city: 'Стамбул', proto: 'TUIC', ping: 71 },
      { code: 'US', city: 'Нью-Йорк', proto: 'TROJAN', ping: 128 },
      { code: 'JP', city: 'Токио', proto: 'SS', ping: 214 }
    ];
    const bar = (h, lit, col) => 'width: 3px; height: ' + h + 'px; border-radius: 1px; background: ' + (lit ? col : '#33333E');
    const servers = raw.map((s, i) => {
      const lvl = s.ping < 60 ? 3 : s.ping < 150 ? 2 : 1;
      const col = lvl === 3 ? '#9BE564' : lvl === 2 ? '#FFB547' : '#FF6B6B';
      const isSel = i === sel;
      return {
        ...s, sel: isSel, protoFg: protoColors[s.proto],
        b1: bar(6, lvl >= 1, col), b2: bar(10, lvl >= 2, col), b3: bar(14, lvl >= 3, col),
        rowStyle: 'display: flex; align-items: center; gap: 12px; width: 100%; height: 56px; padding: 0 12px 0 8px; border-radius: 14px; cursor: pointer; box-sizing: border-box; font-family: inherit; ' +
          (isSel ? 'background: #1E1E26; border: 1.5px solid ' + accent + ';' : 'background: transparent; border: 1.5px solid transparent;'),
        pick: () => this.setState({ sel: i })
      };
    });
    const seg = (active) => 'height: 36px; padding: 0 16px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; ' +
      (active ? 'background: ' + accent + '; color: #0E0E12;' : 'background: transparent; color: #B4B4BE;');
    const btnBase = 'width: 196px; height: 196px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 300ms ease; ';
    const btnStyle = on
      ? btnBase + 'background: ' + accent + '; color: #0E0E12; border: none; box-shadow: 0 0 0 14px ' + this.rgba(accent, 0.12) + ', 0 0 0 30px ' + this.rgba(accent, 0.05) + ', 0 20px 80px ' + this.rgba(accent, 0.35) + ';'
      : busy
        ? btnBase + 'background: #1C1C24; color: ' + accent + '; border: 2px solid ' + accent + '; box-shadow: 0 0 0 14px ' + this.rgba(accent, 0.06) + ';'
        : btnBase + 'background: #1C1C24; color: #8A8A96; border: 2px solid #2A2A34; box-shadow: 0 20px 60px rgba(0,0,0,0.5);';
    return {
      accent,
      cur: servers[sel],
      servers,
      timer,
      btnStyle,
      glow: on ? 'radial-gradient(closest-side, ' + this.rgba(accent, 0.16) + ', rgba(0,0,0,0))' : 'radial-gradient(closest-side, rgba(255,255,255,0.03), rgba(0,0,0,0))',
      statusText: on ? 'Защищено' : busy ? 'Подключаемся…' : 'Не защищено',
      chipBg: on ? this.rgba(accent, 0.14) : busy ? '#1E1E26' : 'rgba(255,107,107,0.12)',
      chipFg: on ? accent : busy ? '#B4B4BE' : '#FF8A8A',
      btnLabel: on ? 'Отключиться' : 'Подключиться',
      timerColor: on ? '#F4F4F6' : '#5A5A66',
      hint: on ? 'в сети без цензуры' : busy ? 'рукопожатие с сервером' : 'нажми на кнопку — и погнали',
      down: on ? '24.8 МБ/с' : '—',
      up: on ? '2.1 МБ/с' : '—',
      ip: on ? '185.107.•••.•• · NL' : '91.204.•••.•• · дом',
      modeAllOn: mode === 'all' ? 'true' : 'false',
      modeSmartOn: mode === 'smart' ? 'true' : 'false',
      modeAllStyle: seg(mode === 'all'),
      modeSmartStyle: seg(mode === 'smart'),
      setAll: () => this.setState({ mode: 'all' }),
      setSmart: () => this.setState({ mode: 'smart' }),
      toggle: () => {
        if (phase === 'on') { this.setState({ phase: 'off', secs: 0 }); return; }
        if (phase === 'busy') return;
        this.setState({ phase: 'busy' });
        this.wait = setTimeout(() => this.setState({ phase: 'on', secs: 0 }), 1100);
      }
    };
  }
}
</script>
</body>
</html>
