<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>giga-throne — импорт</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#C8FF4D}a:hover{color:#E2FF9A}
button,input,textarea{font-family:inherit}
input::placeholder,textarea::placeholder{color:#8A8A96}
</style>
</helmet>
<div style="width: 1040px; height: 680px; box-sizing: border-box; position: relative; background: #0E0E12; color: #F4F4F6; font-family: Manrope, system-ui, sans-serif; overflow: hidden; border-radius: 20px">

  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex">
    <div style="width: 72px; background: #121217; border-right: 1px solid #1F1F27"></div>
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
      <div style="width: 196px; height: 196px; border-radius: 50%; background: #1C1C24"></div>
    </div>
    <div style="width: 320px; background: #121217; border-left: 1px solid #1F1F27"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(6,6,9,0.78)"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="imp-title" style="position: absolute; left: 50%; top: 50%; width: 580px; margin-left: -290px; transform: translateY(-50%); background: #16161C; border: 1px solid #2A2A34; border-radius: 24px; box-shadow: 0 40px 120px rgba(0,0,0,0.6); padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">

    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 id="imp-title" style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 20px">Добавить серверы</h2>
      <a href="Main.dc.html" aria-label="Закрыть" style="width: 36px; height: 36px; border-radius: 10px; background: #22222B; color: #B4B4BE; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>

    <div role="tablist" aria-label="Способ импорта" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #0F0F14">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
        <button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <sc-if value="{{isLink}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #B4B4BE; font-weight: 600">Ссылки — по одной на строку
          <textarea aria-label="Ссылки на серверы" style="height: 92px; resize: none; padding: 12px 14px; border-radius: 14px; border: 1.5px solid {{accent}}; background: #0F0F14; color: #F4F4F6; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 20px; outline: none; box-sizing: border-box">vless://3f1c…@nl1.example.net:443?security=reality&amp;sni=…#Amsterdam
hy2://k9…@de1.example.net:8443?obfs=salamander#Frankfurt
tuic://a7…@tr1.example.net:443?congestion_control=bbr#Istanbul</textarea>
        </label>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="font-size: 13px; font-weight: 700">Нашли 3 сервера</div>
          <sc-for list="{{parsed}}" as="p" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 12px; border-radius: 12px; background: #1C1C24">
              <span style="width: 30px; height: 30px; border-radius: 8px; background: #2A2A34; display: flex; align-items: center; justify-content: center; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 10px">{{p.code}}</span>
              <span style="flex-grow: 1; font-weight: 700; font-size: 14px">{{p.city}} <span style="font-weight: 500; color: #8A8A96; font-size: 12px">· {{p.transport}}</span></span>
              <span style="{{p.tagStyle}}">{{p.proto}}</span>
              <span style="width: 22px; height: 22px; border-radius: 50%; background: {{accent}}; color: #0E0E12; display: flex; align-items: center; justify-content: center">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
              </span>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isSub}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #B4B4BE; font-weight: 600">Ссылка на подписку
          <input type="url" placeholder="https://…/sub/…" style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1.5px solid #2A2A34; background: #0F0F14; color: #F4F4F6; font-family: 'JetBrains Mono', monospace; font-size: 13px; outline: none; box-sizing: border-box">
        </label>
        <label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #B4B4BE; font-weight: 600">Название
          <input type="text" placeholder="Моя подписка" style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1.5px solid #2A2A34; background: #0F0F14; color: #F4F4F6; font-size: 14px; outline: none; box-sizing: border-box">
        </label>
        <div style="font-size: 13px; color: #8A8A96; line-height: 20px">Подписка обновляется сама раз в 12 часов. Понимаем base64, sing-box JSON, Clash и v2rayN.</div>
      </div>
    </sc-if>

    <sc-if value="{{isDrop}}" hint-placeholder-val="{{ false }}">
      <div style="height: 220px; border-radius: 18px; border: 1.5px dashed #3A3A46; background: #0F0F14; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: #22222B; color: {{accent}}; display: flex; align-items: center; justify-content: center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3"></path><path d="M16 4h3a1 1 0 0 1 1 1v3"></path><path d="M20 16v3a1 1 0 0 1-1 1h-3"></path><path d="M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M9 9h6v6H9z"></path></svg>
        </div>
        <div style="font-weight: 700; font-size: 15px">{{dropTitle}}</div>
        <div style="font-size: 13px; color: #8A8A96">{{dropHint}}</div>
      </div>
    </sc-if>

    <div style="display: flex; align-items: center; gap: 12px">
      <div style="flex-grow: 1; font-size: 12px; color: #8A8A96">Совет: жми <span style="font-family: 'JetBrains Mono', monospace; padding: 2px 6px; border-radius: 6px; background: #22222B; color: #F4F4F6">Ctrl+V</span> в любом месте окна</div>
      <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
        <a href="Servers.dc.html" style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: 14px; background: #22222B; color: {{accent}}; font-size: 15px; font-weight: 700; text-decoration: none">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>+3 сервера · смотреть</a>
      </sc-if>
      <sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
        <button onClick="{{add}}" style="height: 48px; padding: 0 24px; border-radius: 14px; border: none; background: {{accent}}; color: #0E0E12; font-size: 15px; font-weight: 800; cursor: pointer">{{addLabel}}</button>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8FF4D","options":["#C8FF4D","#FF7AD9","#5CE1FF","#FF9F43"]},"$preview":{"width":1040,"height":680}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'link', done: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#C8FF4D';
    const { tab, done } = this.state;
    const defs = [['link', 'Ссылка'], ['sub', 'Подписка'], ['qr', 'QR-код'], ['file', 'Файл']];
    const tabs = defs.map(([id, label]) => ({
      label, on: tab === id ? 'true' : 'false',
      pick: () => this.setState({ tab: id, done: false }),
      style: 'height: 36px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; ' +
        (tab === id ? 'background: #2A2A34; color: #F4F4F6;' : 'background: transparent; color: #8A8A96;')
    }));
    const tag = (fg, bg) => 'height: 22px; padding: 0 8px; border-radius: 6px; display: inline-flex; align-items: center; font-size: 11px; font-weight: 800; letter-spacing: 0.05em; color: ' + fg + '; background: ' + bg;
    const parsed = [
      { code: 'NL', city: 'Амстердам', transport: 'Reality', proto: 'VLESS', tagStyle: tag('#9DB8FF', 'rgba(157,184,255,0.12)') },
      { code: 'DE', city: 'Франкфурт', transport: 'Salamander', proto: 'HY2', tagStyle: tag('#FFB0E6', 'rgba(255,176,230,0.12)') },
      { code: 'TR', city: 'Стамбул', transport: 'BBR', proto: 'TUIC', tagStyle: tag('#8FE3F2', 'rgba(143,227,242,0.12)') }
    ];
    return {
      accent, tabs, parsed,
      isLink: tab === 'link',
      isSub: tab === 'sub',
      isDrop: tab === 'qr' || tab === 'file',
      dropTitle: tab === 'qr' ? 'Перетащи скрин с QR-кодом' : 'Перетащи файл конфига',
      dropHint: tab === 'qr' ? 'или вставь картинку из буфера — распознаем сами' : '.json, .yaml, .conf (WireGuard), .ovpn',
      done, notDone: !done,
      addLabel: tab === 'sub' ? 'Подписаться' : tab === 'link' ? 'Добавить 3' : 'Выбрать файл',
      add: () => this.setState({ done: true })
    };
  }
}
</script>
</body>
</html>
